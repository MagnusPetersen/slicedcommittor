# Stub workflow: PyPI publishing on tag push. Activate once the GitHub
# remote exists and a PYPI_API_TOKEN secret has been configured.
#
# To enable: uncomment the `on:` block below and set up trusted publishing
# (preferred) or a PyPI API token in repository secrets.

name: release

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    if: false  # remove this gate when ready to publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
