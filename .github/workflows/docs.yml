name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build HTML
        working-directory: docs
        run: |
          # `-W` (warnings-as-errors) is off for now: ~44 pre-existing docutils
          # docstring-formatting warnings inherited from the monorepo's lib/.
          # Re-enable once those are cleaned up; matches .readthedocs.yaml
          # which already runs with fail_on_warning: false.
          python -m sphinx -b html . _build/html

      - name: Link check
        working-directory: docs
        run: |
          python -m sphinx -b linkcheck . _build/linkcheck || true

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
