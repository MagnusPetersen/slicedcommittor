name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.5

      - name: ruff check
        run: ruff check sliced_committor

      - name: ruff format (check)
        run: ruff format --check sliced_committor

  em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject em dashes in committed text
        run: |
          set -e
          # U+2014 (EM DASH) is forbidden in committed text. Encode as
          # \xe2\x80\x94 so this workflow file itself stays free of one.
          if grep -rnP "\xe2\x80\x94" sliced_committor/ docs/ examples/ \
              README.md CONTRIBUTING.md CHANGELOG.md \
              --include='*.py' --include='*.md' --include='*.rst' \
              --include='*.yaml' --include='*.yml' --include='*.toml' 2>/dev/null; then
            echo "::error::Em dashes (U+2014) are not allowed in committed text."
            exit 1
          fi
          echo "No em dashes found."
