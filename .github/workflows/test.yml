name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run tests
        run: |
          pytest sliced_committor/tests -v \
            --cov=sliced_committor \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  numerics:
    # The golden gates are bit-exact only in the environment the references
    # were frozen in (jax 0.5.3); the version matrix above runs them at the
    # measured cross-version drift (sliced_committor/tests/test_golden.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with the frozen JAX
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test] "jax==0.5.3" "jaxlib==0.5.3"
      - name: Run the suite with the golden gates bit for bit
        run: pytest sliced_committor/tests -v

  umbrella:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with the umbrella extra (mdtraj, pymbar)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,umbrella]
      - name: Run the umbrella tests with MBAR and mdtraj present
        run: pytest sliced_committor/tests -k "umbrella or public_api" -v
